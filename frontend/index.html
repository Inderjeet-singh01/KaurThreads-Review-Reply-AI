<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint (system font until Inter arrives). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <title>Review Reply AI</title>
  </head>
  <body>
    <div id="root">
      <!-- Painted before the JavaScript loads; React replaces it with
           StartupScreen (same look). Contains no account or review data. -->
      <div class="flex min-h-screen items-center justify-center bg-[#f6f8fb] px-4">
        <div class="w-full max-w-sm text-center">
          <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-navy-900 shadow-card">
            <svg class="h-7 w-7 text-brand-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z" />
              <path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1" />
            </svg>
          </div>
          <p class="mt-4 text-lg font-bold text-slate-900">Review Reply AI</p>
          <div class="mt-6">
            <div class="mx-auto h-1 w-40 overflow-hidden rounded-full bg-brand-100">
              <div class="h-full w-1/3 animate-indeterminate rounded-full bg-brand-600"></div>
            </div>
            <p class="mt-3 text-sm font-medium text-slate-500">Loading…</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
