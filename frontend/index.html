<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking the first paint (system font until Inter arrives). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <title>Review Reply AI</title>
  </head>
  <body>
    <div id="root">
      <!-- Painted before the JavaScript loads; React replaces it with
           StartupScreen (same look). Contains no account or review data. -->
      <div class="flex min-h-screen items-center justify-center bg-[#f8fafc] px-4">
        <div class="w-full max-w-sm text-center">
          <img src="/favicon.svg" alt="" class="mx-auto h-14 w-14 rounded-2xl shadow-card" />
          <p class="mt-4 text-lg font-bold text-[#111827]">Review Reply AI</p>
          <div class="mt-6">
            <div class="mx-auto h-1 w-40 overflow-hidden rounded-full bg-brand-100">
              <div class="h-full w-1/3 animate-indeterminate rounded-full bg-brand-600"></div>
            </div>
            <p class="mt-3 text-sm font-medium text-slate-500">Loading…</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
