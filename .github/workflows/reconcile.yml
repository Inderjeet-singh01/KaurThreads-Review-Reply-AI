# Scheduled reconciliation: the safety net for review notifications that
# Pub/Sub never delivers (see README 13.11). Every hour it wakes the Render
# backend, then runs POST /automation/reconcile, which replies to recent
# unanswered reviews through the same pipeline as the webhook.
#
# Requires the repository secret RECONCILIATION_SECRET (same value as on Render).
name: Reconcile reviews

on:
  schedule:
    - cron: "17 * * * *" # hourly; off the top of the hour, when GitHub queues lag most
  workflow_dispatch:

concurrency:
  group: reconcile
  cancel-in-progress: false

permissions: {}

env:
  BACKEND_URL: https://kaurthreads.duckdns.org

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the backend (free Render instances sleep when idle)
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 30 "$BACKEND_URL/health"; then exit 0; fi
            echo "backend not ready (attempt $attempt); retrying in 10 s"
            sleep 10
          done
          echo "::error::backend did not wake up"
          exit 1

      - name: Reconcile recent unanswered reviews
        env:
          RECONCILIATION_SECRET: ${{ secrets.RECONCILIATION_SECRET }}
        run: |
          if [ -z "$RECONCILIATION_SECRET" ]; then
            echo "::error::repository secret RECONCILIATION_SECRET is not set"
            exit 1
          fi
          status=$(curl -sS --max-time 300 -o response.json -w "%{http_code}" -X POST \
            -H "X-Reconcile-Secret: $RECONCILIATION_SECRET" \
            "$BACKEND_URL/automation/reconcile?trigger=github_actions&wait=true&wait_timeout=240")
          echo "HTTP $status"
          # The summary carries ids and outcomes only (never reply text or secrets).
          jq '{started, status, reason, dry_run, total, published, would_publish, skipped,
               failed, deferred, items: [.items[]? | {review_id, outcome, final_status, error_stage}]}' \
            response.json || cat response.json
          case "$status" in
            200|202) ;;
            409) echo "::warning::reconciliation not started (already running or automation off)" ;;
            *) echo "::error::reconciliation failed with HTTP $status"; exit 1 ;;
          esac
          if [ "$(jq -r '.failed // 0' response.json)" != "0" ]; then
            echo "::warning::some reviews failed; see the items above and the Render logs"
          fi
